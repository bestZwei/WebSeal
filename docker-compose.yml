version: '3.8'

services:
  webseal:
    build: 
      context: .
      dockerfile: Dockerfile
    ports:
      - "3000:3000"
    environment:
      - NODE_ENV=production
      - PUPPETEER_SKIP_CHROMIUM_DOWNLOAD=true
      - PUPPETEER_EXECUTABLE_PATH=/usr/bin/chromium-browser
      # 水印签名密钥（生成方式: node scripts/generate-keys.mjs），取消注释并填入 PEM 内容
      # - WEBSEAL_PRIVATE_KEY=-----BEGIN PRIVATE KEY-----...
      # - WEBSEAL_PUBLIC_KEY=-----BEGIN PUBLIC KEY-----...
    restart: unless-stopped
    mem_limit: 1g
    mem_reservation: 512m
    volumes:
      - /dev/shm:/dev/shm
    healthcheck:
      # alpine 镜像没有 curl，使用 busybox 自带的 wget
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/health"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 40s

networks:
  default:
    name: webseal-network
