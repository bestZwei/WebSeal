name: Release

# 触发方式：
#   1) 推送 v*.*.* 标签自动发布（推荐，配合 npm run release:patch）
#   2) 手动在 Actions 页面运行，输入版本号（如 v1.0.0），会自动补建标签后发布
#
# 产物：
#   - Docker 镜像推送到 GHCR：ghcr.io/<owner>/webseal:<version>、:<major>.<minor>、:latest
#   - GitHub Release（自动生成更新说明 + 镜像拉取命令）

on:
  push:
    tags:
      - 'v*.*.*'
  workflow_dispatch:
    inputs:
      tag:
        description: '要发布的版本号（需以 v 开头，例如 v1.0.0）'
        required: true
        type: string

permissions:
  contents: write
  packages: write

env:
  REGISTRY: ghcr.io

jobs:
  publish:
    name: 构建并推送 Docker 镜像
    runs-on: ubuntu-latest
    outputs:
      version: ${{ steps.ver.outputs.version }}
      tag: ${{ steps.ver.outputs.tag }}
      image: ${{ steps.ver.outputs.image }}
      major: ${{ steps.ver.outputs.major }}
      minor: ${{ steps.ver.outputs.minor }}
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 解析版本号
        id: ver
        run: |
          set -euo pipefail
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF#refs/tags/}"
          fi
          case "$TAG" in
            v*) ;;
            *) echo "::error::版本号必须以 v 开头（例如 v1.0.0），当前为 $TAG"; exit 1 ;;
          esac
          VERSION="${TAG#v}"
          MAJOR="$(echo "$VERSION" | cut -d. -f1)"
          MINOR="$(echo "$VERSION" | cut -d. -f2)"
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=$VERSION" >> "$GITHUB_OUTPUT"
          echo "major=$MAJOR" >> "$GITHUB_OUTPUT"
          echo "minor=$MINOR" >> "$GITHUB_OUTPUT"
          echo "image=${{ env.REGISTRY }}/$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')/webseal" >> "$GITHUB_OUTPUT"

      - name: 校验 package.json 版本与标签一致（标签推送时）
        if: github.event_name == 'push'
        run: |
          set -euo pipefail
          PKG="$(node -p "require('./package.json').version")"
          if [ "$PKG" != "${{ steps.ver.outputs.version }}" ]; then
            echo "::error::package.json 版本 ($PKG) 与标签 (${{ steps.ver.outputs.version }}) 不一致，请先执行 npm version"
            exit 1
          fi

      - name: 补建并推送 Git 标签（手动触发时）
        if: github.event_name == 'workflow_dispatch'
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git tag "${{ steps.ver.outputs.tag }}"
          git push origin "${{ steps.ver.outputs.tag }}"

      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 登录 GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: 生成镜像标签与元数据
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ steps.ver.outputs.image }}
          tags: |
            type=raw,value=${{ steps.ver.outputs.version }}
            type=raw,value=${{ steps.ver.outputs.major }}.${{ steps.ver.outputs.minor }}
            type=raw,value=latest
          labels: |
            org.opencontainers.image.title=WebSeal
            org.opencontainers.image.description=专业的网页存证工具 - 盲水印 + 可信时间戳
            org.opencontainers.image.vendor=WebSeal Team

      - name: 构建并推送镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          build-args: |
            VERSION=${{ steps.ver.outputs.version }}
            BUILD_DATE=${{ fromJSON(steps.meta.outputs.json).labels['org.opencontainers.image.created'] }}
            VCS_REF=${{ github.sha }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 冒烟测试已推送的镜像
        run: |
          set -euo pipefail
          IMAGE="${{ steps.ver.outputs.image }}:${{ steps.ver.outputs.version }}"
          docker run -d --name webseal-smoke --shm-size=256m -p 3000:3000 "$IMAGE"
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'
          docker rm -f webseal-smoke

  release:
    name: 创建 GitHub Release
    needs: publish
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: 创建 Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.publish.outputs.tag }}
          name: WebSeal ${{ needs.publish.outputs.tag }}
          generate_release_notes: true
          body: |
            ## 🐳 Docker 镜像

            ```bash
            docker pull ${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.version }}
            ```

            可用标签：`${{ needs.publish.outputs.version }}`（精确版本）、`${{ needs.publish.outputs.major }}.${{ needs.publish.outputs.minor }}`（小版本线）、`latest`

            一键启动：

            ```bash
            curl -O https://raw.githubusercontent.com/${{ github.repository }}/${{ needs.publish.outputs.tag }}/docker-compose.yml
            WEBSEAL_IMAGE=${{ needs.publish.outputs.image }}:${{ needs.publish.outputs.version }} docker compose up -d
            ```

            ## 📋 更新内容

            详见下方自动生成的更新说明。完整历史见 [CHANGELOG.md](https://github.com/${{ github.repository }}/blob/main/CHANGELOG.md)。
