name: CI

# 每次推送 / PR 都做质量校验，确保代码可构建、Dockerfile 可构建且容器健康检查通过。
# 版本号发布由 release.yml 负责（推送 v*.*.* 标签时触发）。

on:
  push:
    branches: [main]
  pull_request:

permissions:
  contents: read
  packages: read

jobs:
  test:
    name: 测试与构建
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Type check
        run: npm run type-check

      - name: Unit tests (watermark & signature)
        run: npm test

      - name: Build
        run: npm run build

  docker:
    name: Docker 镜像冒烟测试
    runs-on: ubuntu-latest
    steps:
      - name: 检出代码
        uses: actions/checkout@v4

      - name: 准备 Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: 构建本地镜像
        uses: docker/build-push-action@v6
        with:
          context: .
          file: ./Dockerfile
          platforms: linux/amd64
          push: false
          load: true
          tags: webseal:ci
          build-args: |
            VERSION=0.0.0-ci
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: 启动容器并检查健康接口
        run: |
          set -euo pipefail
          docker run -d --name webseal-ci --shm-size=256m -p 3000:3000 webseal:ci
          for i in $(seq 1 30); do
            if curl -fsS http://localhost:3000/api/health; then echo; break; fi
            sleep 2
          done
          curl -fsS http://localhost:3000/api/health | grep -q '"status":"ok"'

      - name: 校验镜像内置中文字体（缺字体会导致截图中文变方块）
        run: |
          set -euo pipefail
          COUNT="$(docker run --rm webseal:ci sh -c 'fc-list :lang=zh | wc -l')"
          echo "CJK 字体数量: $COUNT"
          if [ "$COUNT" -eq 0 ]; then
            echo "::error::镜像缺少中文字体，请确认 Dockerfile 已安装 font-noto-cjk"
            exit 1
          fi

      - name: 输出容器日志（失败时）
        if: failure()
        run: docker logs webseal-ci

      - name: 清理
        if: always()
        run: docker rm -f webseal-ci || true
